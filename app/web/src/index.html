  <style>
    :root { --sp-bg: #0b0d12; --sp-text: #eef0f6; --sp-muted: #8a91a5; --sp-track: #262c3d; }
    @media (prefers-color-scheme: light) { :root { --sp-bg: #f2f3f7; --sp-text: #141821; --sp-muted: #626a7e; --sp-track: #e7e9f0; } }
    html, body { margin: 0; background: var(--sp-bg); }
    .splash { position: fixed; inset: 0; background: var(--sp-bg); color: var(--sp-text); }
    .splash__logo { position: absolute; left: 50%; top: 50%; width: 88px; height: 88px;
      transform: translate(-50%, -50%); animation: splash-latido 1.6s ease-in-out infinite; }
    .splash__pie { position: absolute; left: 24px; right: 24px; top: calc(50% + 62px);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      font: 700 20px/1.2 system-ui, -apple-system, 'Segoe UI', sans-serif; animation: splash-aparece .3s ease both; }
    .splash__barra { width: 120px; height: 4px; border-radius: 2px; background: var(--sp-track); overflow: hidden; }
    .splash__barra::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #6c8cff, #9b7bff); animation: splash-carga 1.1s ease-in-out infinite; }
    .splash__lento { font: 500 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--sp-muted);
      text-align: center; max-width: 260px; opacity: 0; animation: splash-aparece .4s ease 6s forwards;
      display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .splash__lento button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 14px; color: #fff;
      background: linear-gradient(135deg, #6c8cff, #9b7bff); font: 700 15px system-ui, -apple-system, sans-serif; }
    @keyframes splash-carga { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @keyframes splash-latido { 50% { transform: translate(-50%, -50%) scale(.94); } }
    @keyframes splash-aparece { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .splash__logo { animation: none; } .splash__barra::after { animation-duration: 2.4s; } }
  </style>

<body>
  <app-root>
    <div class="splash" role="status" aria-label="Cargando">
      <svg class="splash__logo" aria-hidden="true" xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c8cff"/><stop offset="1" stop-color="#9b7bff"/></linearGradient></defs><rect width='120' height='120' rx='34' fill='url(#g)'/><g transform='translate(60 60) scale(2.6) translate(-12 -12)' fill='none' stroke='#fff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V17h5.2v-1.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z'/></g></svg>

      <div class="splash__pie">
        <div>Not Vont EG</div>
        <div class="splash__barra"></div>
        <div class="splash__lento">
          Está tardando más de lo normal. Revisa tu conexión a internet.
          <button type="button" onclick="location.reload()">Reintentar</button>
        </div>
      </div>
    </div>
  </app-root>
  <script>
    // Si a los 10 s sigue la pantalla de carga, recarga una vez por sesión (main.ts borra la marca).
    setTimeout(function () {
      if (!document.querySelector('.splash')) return;
      try { if (sessionStorage.getItem('app-reintento')) return; sessionStorage.setItem('app-reintento', '1'); }
      catch (e) { return; }
      location.reload();
    }, 10000);
  </script>
