server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sin esto nginx sirve el manifest como texto y la PWA no se puede instalar
    types { application/manifest+json webmanifest; }

    # SPA: cualquier ruta cae en index.html. La página y el service worker nunca se guardan
    # en la caché HTTP, para que una publicación nueva se vea en la siguiente apertura.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    # Configuración editable sin recompilar (dirección del API): siempre la última
    location = /config.json {
        add_header Cache-Control "no-cache";
    }
    # Archivos con huella en el nombre (main-XV2HOIMG.js): nunca cambian
    location ~* -[A-Z0-9]{8}\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API: proxy al backend .NET (servicio "api" del docker-compose)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
